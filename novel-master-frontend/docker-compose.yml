version: '3.8'

services:
  # -------------------------------------------------------------------------
  # Novel Master Web Application
  # -------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel-master-web
    ports:
      - "5000:5000"
    volumes:
      - novel-master-storage:/app/storage
      - novel-master-continuity:/app/continuity
    environment:
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY is required}
      - FLASK_ENV=production
      - DB_PATH=/app/continuity/novel_master.db
      - STORAGE_ROOT=/app/storage
      - JWT_EXPIRY_DAYS=${JWT_EXPIRY_DAYS:-7}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://yourdomain.com}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # MEDIUM FIX #5: Log rotation to prevent disk fill
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # -------------------------------------------------------------------------
  # Redis - WebSocket message queue + session store
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: novel-master-redis
    volumes:
      - novel-master-redis:/data
    restart: unless-stopped
    # MEDIUM FIX #5: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # -------------------------------------------------------------------------
  # Nginx Reverse Proxy (SSL termination + rate limiting)
  # -------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: novel-master-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
    restart: unless-stopped
    # MEDIUM FIX #5: Log rotation
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ---------------------------------------------------------------------------
# Named Volumes (survive container restarts)
# ---------------------------------------------------------------------------
volumes:
  novel-master-storage:
    driver: local
  novel-master-continuity:
    driver: local
  novel-master-redis:
    driver: local
